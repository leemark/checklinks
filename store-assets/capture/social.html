<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CheckLinks Social Card</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background:
        radial-gradient(circle at 8% 4%, rgba(45, 184, 77, 0.25), transparent 360px),
        radial-gradient(circle at 96% 15%, rgba(61, 127, 240, 0.32), transparent 430px),
        linear-gradient(145deg, #181a20, #202634);
      color: #fff;
    }
    .copy { position: absolute; z-index: 2; top: 66px; left: 60px; width: 495px; }
    .brand { display: flex; align-items: center; gap: 12px; color: #b7e8c3; font-size: 18px; font-weight: 850; letter-spacing: .11em; text-transform: uppercase; }
    .brand img { width: 36px; height: 36px; }
    h1 { margin: 52px 0 0; max-width: 490px; font-size: 61px; line-height: 1.02; letter-spacing: -.048em; }
    .sub { max-width: 450px; margin: 25px 0 0; color: #c7cdd8; font-size: 21px; line-height: 1.45; }
    .trust { margin-top: 36px; color: #a5ddb4; font-size: 15px; font-weight: 700; letter-spacing: .01em; }
    .proof {
      position: absolute;
      top: 112px;
      left: 530px;
      width: 650px;
      height: 406px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 16px;
      box-shadow: 0 35px 90px rgba(0,0,0,.5);
      transform: rotate(-1deg);
      background: #eef3f9;
    }
    .proof img { width: 100%; height: 100%; object-fit: cover; }
    .proof-label { position: absolute; right: 23px; bottom: 18px; padding: 7px 11px; border-radius: 999px; background: rgba(15,23,42,.88); color: #fff; font-size: 12px; font-weight: 750; }
  </style>
</head>
<body>
  <main class="card">
    <section class="copy">
      <div class="brand"><img src="/icon128.png" alt="">CheckLinks</div>
      <h1>Find broken links right on the page</h1>
      <p class="sub">Check one webpage in Chrome, see problems in context, and export a clean report.</p>
      <p class="trust">Free to use · No account · No analytics or tracking · Open source</p>
    </section>
    <figure class="proof">
      <img src="/checklinks-results.jpg" alt="">
      <figcaption class="proof-label">Actual extension results</figcaption>
    </figure>
  </main>
</body>
</html>
