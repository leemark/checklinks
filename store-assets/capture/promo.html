<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CheckLinks Promotional Art</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .art { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle at 85% 20%, rgba(59,130,246,.32), transparent 44%), linear-gradient(135deg, #111827, #1e293b 62%, #172554); color: #fff; }
    .wordmark { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 850; letter-spacing: .05em; text-transform: uppercase; }
    .wordmark img { width: 28px; height: 28px; }
    h1 { margin: 0; letter-spacing: -.045em; line-height: 1.02; }
    p { margin: 0; color: #cbd5e1; }
    .page-card { position: absolute; overflow: hidden; background: #f8fafc; border: 1px solid rgba(255,255,255,.28); border-radius: 13px; box-shadow: 0 26px 70px rgba(0,0,0,.42); }
    .browser-bar { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; background: #e2e8f0; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #94a3b8; }
    .address { flex: 1; height: 17px; margin-left: 5px; padding: 2px 8px; border-radius: 4px; background: #fff; color: #64748b; font: 9px ui-monospace, monospace; }
    .page-body { position: relative; height: calc(100% - 34px); padding: 24px; background: linear-gradient(120deg, #fff, #f1f5f9); }
    .line { width: 47%; height: 9px; margin-bottom: 12px; border-radius: 10px; background: #cbd5e1; }
    .line.short { width: 31%; }
    .page-link { display: inline-block; margin: 9px 0; padding: 4px 7px; outline: 2px solid #ef4444; color: #1d4ed8; font-size: 13px; font-weight: 750; }
    .page-link b { margin-left: 5px; padding: 2px 4px; border-radius: 3px; background: #ef4444; color: #fff; font: 9px ui-monospace, monospace; }
    .panel { position: absolute; overflow: hidden; background: #f8fafc; border-radius: 9px; box-shadow: 0 14px 35px rgba(15,23,42,.28); color: #1e293b; }
    .panel-head { padding: 10px 13px; background: #1e293b; color: #fff; }
    .panel-title { font-size: 12px; font-weight: 800; }
    .panel-status { margin-top: 2px; color: #94a3b8; font-size: 9px; }
    .stats { display: flex; gap: 5px; padding: 9px 10px; background: #fff; border-bottom: 1px solid #e2e8f0; }
    .stat { padding: 3px 7px; border-radius: 10px; background: #f1f5f9; font-size: 8px; white-space: nowrap; }
    .stat.red { color: #dc2626; font-weight: 800; outline: 1px solid #93c5fd; }
    .result { display: grid; grid-template-columns: 7px 1fr auto; gap: 7px; align-items: center; padding: 9px 10px; border-bottom: 1px solid #edf2f7; font-size: 9px; }
    .result-dot { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; }
    .result-status { color: #64748b; font-weight: 800; }
    .trust { color: #93c5fd; font-size: 12px; font-weight: 750; }

    .small .copy { position: absolute; inset: 25px 24px auto; z-index: 2; }
    .small h1 { width: 270px; margin-top: 18px; font-size: 30px; }
    .small .trust { margin-top: 12px; font-size: 10px; }
    .small .page-card { right: -16px; bottom: -38px; width: 238px; height: 162px; transform: rotate(-2deg); }
    .small .page-body { padding: 14px; }
    .small .panel { right: 10px; bottom: 12px; width: 126px; }
    .small .panel-head { padding: 7px 8px; }
    .small .stats { display: none; }
    .small .result { padding: 7px 8px; font-size: 7px; }
    .small .page-link { font-size: 9px; }

    .marquee .copy { position: absolute; left: 72px; top: 67px; width: 460px; z-index: 2; }
    .marquee h1 { margin-top: 42px; font-size: 61px; }
    .marquee .sub { width: 430px; margin-top: 23px; font-size: 18px; line-height: 1.55; }
    .marquee .trust { margin-top: 31px; font-size: 14px; }
    .marquee .page-card { right: -72px; top: 50px; width: 800px; height: 465px; }
    .marquee .panel { right: 34px; top: 78px; width: 330px; }
    .marquee .panel-head { padding: 13px 15px; }
    .marquee .panel-title { font-size: 14px; }
    .marquee .panel-status { font-size: 10px; }
    .marquee .result { padding: 12px 13px; font-size: 11px; }
  </style>
</head>
<body>
  <main class="art" id="art">
    <section class="copy">
      <div class="wordmark"><img src="/icon128.png" alt=""><span>CheckLinks</span></div>
      <h1 id="headline"></h1>
      <p class="sub" id="sub"></p>
      <p class="trust" id="trust"></p>
    </section>
    <section class="page-card" aria-label="Illustration of the CheckLinks interface">
      <div class="browser-bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="address">northstar.example/resources</span></div>
      <div class="page-body">
        <div class="line short"></div><div class="line"></div>
        <span class="page-link">Content standards handbook <b>404</b></span>
        <div class="panel">
          <div class="panel-head"><div class="panel-title">CheckLinks</div><div class="panel-status">Done. 9 links checked.</div></div>
          <div class="stats"><span class="stat">3 OK</span><span class="stat">1 Redirect</span><span class="stat red">3 Broken</span></div>
          <div class="result"><span class="result-dot"></span><span>/missing-guide</span><span class="result-status">404</span></div>
          <div class="result"><span class="result-dot"></span><span>/missing-image</span><span class="result-status">404</span></div>
        </div>
      </div>
    </section>
  </main>
  <script>
    const format = new URLSearchParams(location.search).get("format") || "small";
    document.getElementById("art").classList.add(format);
    if (format === "small") {
      document.getElementById("headline").textContent = "Find broken links in one click";
      document.getElementById("trust").textContent = "Free · Open source · No tracking";
    } else {
      document.getElementById("headline").innerHTML = "Check every link.<br>Fix the right one.";
      document.getElementById("sub").textContent = "Highlight broken links, redirects, and network errors directly on the page.";
      document.getElementById("trust").textContent = "Always free · Open source · No account · No tracking";
    }
  </script>
</body>
</html>
